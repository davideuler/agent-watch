<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Watch - Release Superpower Console</title>
    <meta name="description" content="Monitor OpenClaw and Hermes release stability as an operational superpower console." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%89%3C/text%3E%3C/svg%3E" />
    <script>
      (function() {
        var valid = ['light','dark','ocean','terminal','rose'];
        try {
          var stored = localStorage.getItem('agent-watch-theme');
          var theme = valid.indexOf(stored) !== -1 ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">AGENT/WATCH</span>
        <span class="brand-tag">// release superpower console</span>
      </div>
      <nav class="project-tabs" id="project-tabs"></nav>
      <select class="theme-select" id="theme-select" aria-label="Choose theme">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="ocean">Ocean</option>
        <option value="terminal">Terminal</option>
        <option value="rose">Rose</option>
      </select>
      <div class="auth-area" id="auth-area">
        <span class="auth-loading muted">··· auth</span>
      </div>
    </header>

    <main class="main">
      <section class="overview" id="overview">
        <span class="overview-eyebrow">capability telemetry</span>
        <h1 id="project-title">Loading...</h1>
        <p id="project-meta" class="muted"></p>
        <div class="stat-rail" id="project-stats" aria-live="polite"></div>
      </section>

      <section class="legend">
        <span class="legend-item"><span class="dot dot-critical"></span><span>CRITICAL DRAIN</span><span class="legend-range">0-4</span></span>
        <span class="legend-item"><span class="dot dot-neutral"></span><span>FLUX FIELD</span><span class="legend-range">5</span></span>
        <span class="legend-item"><span class="dot dot-prime"></span><span>PRIME POWER</span><span class="legend-range">6-10</span></span>
        <span class="legend-spacer"></span>
        <span class="legend-pulse"><span class="legend-pulse-dot"></span><span>LIVE · hourly cron</span></span>
      </section>

      <section class="versions" id="versions">
        <div class="loading">syncing capability matrix</div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer-mark">◉</span>
      <span>Capability levels scored from GitHub issues + LLM sentiment + user ratings.</span>
      <span class="footer-sep">·</span>
      <a href="https://aicompass.dev/" target="_blank" rel="noreferrer">AI Compass</a>
      <span class="footer-sep">·</span>
      <a href="https://bittide.aicompass.dev/" target="_blank" rel="noreferrer">BitTide Tech News</a>
      <span class="footer-sep">·</span>
      <a href="/healthz">/healthz</a>
    </footer>

    <template id="version-card-template">
      <article class="version-card">
        <header class="vc-header">
          <div class="vc-tag-block">
            <h2 class="vc-tag"></h2>
            <span class="vc-name muted"></span>
          </div>
          <div class="vc-score-block">
            <div class="vc-rank"></div>
            <div class="vc-score"></div>
            <div class="vc-state muted"></div>
          </div>
        </header>
        <div class="vc-gauge">
          <div class="vc-bar"><div class="vc-bar-fill"></div></div>
          <div class="vc-bar-ticks">
            <span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span>
          </div>
        </div>
        <div class="vc-meta muted"></div>
        <div class="vc-actions">
          <a class="vc-download" target="_blank" rel="noreferrer">Download</a>
          <a class="vc-release-link" target="_blank" rel="noreferrer">Release notes</a>
          <button class="vc-toggle">Show issues & rate ▾</button>
        </div>
        <div class="vc-detail" hidden>
          <div class="vc-issues"><h3>Related issues</h3><ul class="vc-issues-list"></ul></div>
          <div class="vc-rating">
            <h3>Your rating</h3>
            <div class="rating-form" hidden>
              <div class="stars" data-stars></div>
              <textarea class="rating-comment" placeholder="Optional comment about this release…" maxlength="1000"></textarea>
              <button class="rating-submit" type="button">Submit rating</button>
              <span class="rating-status muted"></span>
            </div>
            <div class="rating-login muted" hidden>Login with GitHub or Google to rate this release.</div>
            <div class="rating-summary muted"></div>
          </div>
        </div>
      </article>
    </template>

    <script>
      (function () {
        function setTheme(name) {
          document.documentElement.setAttribute('data-theme', name);
          try { localStorage.setItem('agent-watch-theme', name); } catch (e) {}
        }
        var sel = document.getElementById('theme-select');
        if (!sel) return;
        sel.value = document.documentElement.getAttribute('data-theme') || 'light';
        sel.addEventListener('change', function() { setTheme(sel.value); });
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
